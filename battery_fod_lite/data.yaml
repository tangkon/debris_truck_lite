# =============================================================================
# 电池包上盖异物检测 — 数据集配置（单类 foreign）
# =============================================================================
#
# ★ path 指向【切片后】的训练集，由 `python train.py prepare` 自动生成，不要手改。
#
#   为什么必须是切片集而不是整帧集：
#     部署域 1920x1080、mm_per_px≈0.8 → 5mm 异物原生只有 6.25px，
#     低于 YOLO P3 检测头 ≈8px 的可靠下限。
#     整帧 letterbox 到 1280 是 0.67x 缩小 → 只剩 4.2px，模型根本学不到。
#     切成 640x360 再 letterbox 到 1280 是 2.0x 放大 → 12.5px，稳过下限。
#
#   训练尺度必须等于推理尺度：
#     detect.py 在 1920x1080 上切 640x360 → letterbox 1280（2.0x），
#     本文件指向的训练集是【同一套参数】切出来的，所以模型看到的 5mm
#     目标在训练时和上线时都是 12.5px。这个一致性由 train.py 导出的
#     model_meta.json 里的 grid_signature 强制校验，detect.py 启动时会比对，
#     不一致直接拒绝运行。
#
# ★ 同级目录 dataset_full/ 是整帧 1920x1080 验收集，`python train.py eval` 用它
#   跑端到端指标。**不要拿它训练**（4.2px 学不到东西）。
#
# =============================================================================

path: ./dataset_sliced      # 相对 train.py 所在目录；也可写绝对路径
train: images/train
val: images/val
test: images/test

nc: 1
names:
  0: foreign                # 异物（石头/螺栓/螺母/煤炭等全部归为这一类）
